# Luma: sequência do calamares-settings-debian 13.0.13 (módulos auxiliares desse pacote continuam em uso),
# com a marca "luma" e o módulo luma-efi-fallback (pacote luma-live) depois do bootloader. Este arquivo substitui o do pacote na imagem live (live-build includes.chroot).
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - luma-efi-fallback
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - luma-cleanup
  - umount
- show:
  - finished

branding: luma
prompt-install: false
dont-chroot: false
