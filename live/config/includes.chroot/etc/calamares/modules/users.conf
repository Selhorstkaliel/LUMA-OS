# Luma: igual ao calamares-settings-debian, SEM o grupo "audio". Contas nesse grupo acessam a placa de som
# e o microfone fora da sessão ativa e sobrescrevem o volume de quem está na tela (etapa 4,
# docs/evidence/etapa4/bloqueio-volume/README.md). O acesso ao áudio vem da sessão do logind.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
# A conta root fica sem senha (bloqueada); administração pelo grupo sudo. Não há senha padrão.
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
