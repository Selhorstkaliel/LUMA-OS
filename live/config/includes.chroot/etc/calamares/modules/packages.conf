# Luma: lista do calamares-settings-debian mais o próprio instalador e os ajustes da sessão live,
# para o sistema instalado não ficar com um atalho de instalação nem com configuração de mídia live.
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'luma-live'
      - 'calamares-settings-debian'
      - 'calamares'
